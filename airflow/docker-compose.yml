x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-webserver:8080/execution/'
    AIRFLOW__TASK_SDK__BASE_URL: 'http://airflow-webserver:8080'
    AIRFLOW__SDK__API_BASE_URL: 'http://airflow-webserver:8080'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:?Set a shared random secret in airflow/.env}
    AIRFLOW__API__EXPOSE_CONFIG: 'non-sensitive-only'
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${_AIRFLOW_WWW_USER_USERNAME:-admin}:admin"
    OPENLINEAGE_DISABLED: 'true'
    # Enable Cosmos caching & increase import timeout for Windows Docker mounts
    AIRFLOW__COSMOS__ENABLE_CACHE: 'true'
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: '120'
    # Cosmos dbt Docs — Browse → dbt Docs in the Airflow UI
    AIRFLOW__COSMOS__DBT_DOCS_PROJECTS: '{"job_postings": {"docs_dir": "/opt/airflow/dbt/analytics/target"}}'
    AIRFLOW__COSMOS__DBT_DOCS_CONN_ID: ''
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ../analytics:/opt/airflow/dbt/analytics
    - ../scripts:/opt/airflow/scripts
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        /opt/airflow/dbt_venv/bin/dbt deps --project-dir /opt/airflow/dbt/analytics
        airflow db migrate
        if ! airflow variables get DBT_TARGET_CATALOG >/dev/null 2>&1; then
          airflow variables set DBT_TARGET_CATALOG "${DBT_TARGET_CATALOG:-dev}"
        fi
    environment:
      <<: *airflow-common-env

  airflow-webserver:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        exec airflow api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy

volumes:
  postgres-db-volume:
