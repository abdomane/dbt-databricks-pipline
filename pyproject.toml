[project]
name = "dbt-databricks-pipline"
version = "0.1.0"
description = "dbt (v2) analytics pipeline on Databricks: job postings staging, intermediate and star-schema marts."
readme = "README.md"
authors = [
    { name = "Abderrhman LAKEHAL", email = "ID+username@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dbt>=2.0.11,<3",
]

[project.scripts]
dbt-databricks-pipline = "dbt_databricks_pipline:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
