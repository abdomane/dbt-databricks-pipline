name: analytics

profile: databricks

require-dbt-version: [">=1.12.0", "<2.0.0"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  analytics:
    +schema: seeds
    
flags:
  require_generic_test_arguments_property: true