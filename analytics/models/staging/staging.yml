models:
  - name: stg_job_postings
    description: >
      One row per posting per scrape day - a job re-scraped across days keeps
      every row. 691,950 rows after the door-drop (the scraper's own error flag).
    columns:
      - name: job_id
        description: The scraper's posting id. Not unique at this grain - one row per posting per scrape day.
        data_tests:
          - not_null
      - name: search_term
        description: The role the scraper searched for; three values by construction.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Data Analyst', 'Data Scientist', 'Data Engineer']
      - name: search_date
        description: Scrape day.
      - name: searched_at
        description: Scrape timestamp (search_time renamed).
      - name: search_location
        description: Location parameter the scraper searched under.
      - name: job_title
        description: Posting title as scraped.
      - name: company_name
        description: Employer name, trimmed.
      - name: job_location
        description: Posting location as scraped.
      - name: source_platform
        description: Posting platform (job_via with the 'via ' scraper artifact stripped, ~6.3k rows).
      - name: job_schedule_type
        description: As scraped; 12,252 nulls stay null - documented, not fixed.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Full-time', 'Part-time', 'Contract', 'Internship']
              config:
                severity: WARN
      - name: job_work_from_home
        description: True when the posting is flagged remote.
      - name: job_posted_at
        description: Raw relative posted time ('10 hours ago'), kept unparsed - search_date carries the time axis; parsing it is a supporter exercise.
      - name: job_salary
        description: Raw salary text, unparsed for now.
      - name: salary_min
        description: >
          Lower bound parsed from the salary text (K/M suffixes expanded); a single
          figure is its own range, so min = max. Null when absent or unparseable.
        data_tests:
          - non_negative
      - name: salary_max
        description: >
          Upper bound parsed from the salary text (K/M suffixes expanded); a single
          figure is its own range, so min = max. Null when absent or unparseable.
        data_tests:
          - non_negative
      - name: salary_avg
        description: >
          THE standard salary measure: midpoint of the parsed range (a single figure
          is its own range). Deliberately unit-agnostic - always pair it with
          salary_period and salary_currency filters; averaging across periods or
          currencies is meaningless.
      - name: salary_period
        description: "Pay period parsed from the salary text: year, month, week, day, hour."
      - name: salary_currency
        description: >
          Currency of the salary columns. Leading marker when present; a salaried row
          with no marker is stamped 'USD' (documented assumption). Null only when the
          row has no salary at all.
      - name: has_health_insurance
        description: Posting lists Health insurance among its extensions.
      - name: has_dental_insurance
        description: Posting lists Dental insurance among its extensions.
      - name: has_paid_time_off
        description: Posting lists Paid time off among its extensions.
      - name: has_no_degree_mentioned 
        description: Posting lists No degree mentioned among its extensions.
  - name: stg_job_skills
    description: >
      One row per (job_id, skill_keyword), straight off the raw table.
      A skill_id repeats on a job when the posting names it two ways (spark, pyspark).
      Deliberately boring; rename, order, trim is the discipline working.
    columns:
      - name: job_id
        description: Every row's parent exists in stg_job_postings - the export's join guarantees it.
      - name: skill_id
        description: Skill key; the human-readable text rides in skill_keyword.
      - name: skill_keyword
        description: Skill text as extracted, trimmed.

unit_tests:
  - name: test_parse_salary_shape
    description: >
      The salary parsing UDF is a bit of a black box; this test checks that it
      returns the expected shape (min, max, avg, period, currency) for a few
      representative inputs.
    model: stg_job_postings
    given:
      - input: source('jobs', 'raw_job_postings')
        rows:
          - {job_id: 1, job_salary: "$100K–$120K"}
          - {job_id: 2, job_salary: "32.5 a hour"}
          - {job_id: 3, job_salary: null}
          - {job_id: 4, job_salary: "$50/hour"}
    expect:
      rows:
        - {job_id: 1, salary_min: 100000, salary_max: 120000, salary_avg: 110000, salary_period: null, salary_currency: "$"}
        - {job_id: 2, salary_min: 32.5, salary_max: 32.5, salary_avg: 32.5, salary_period: "hour", salary_currency: "USD"}
        - {job_id: 3, salary_min: null, salary_max: null, salary_avg: null, salary_period: null, salary_currency: null}
        - {job_id: 4, salary_min: 50, salary_max: 50, salary_avg: 50, salary_period: null, salary_currency: "$"}